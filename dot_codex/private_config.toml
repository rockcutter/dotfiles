approval_policy = "on-request"
approvals_reviewer = "auto_review"

# 完了通知は Stop hook に統一し、notify との二重通知を避ける。

[features]
hooks = true

[projects."/Users/rockcutter/.local/share/chezmoi"]
trust_level = "trusted"

[projects."/Users/rockcutter/ghq/github.com/voyagegroup/fluct_report_batch"]
trust_level = "trusted"

[projects."/Users/rockcutter"]
trust_level = "trusted"

[projects."/Users/rockcutter/ghq/github.com/voyagegroup/fluct_funnel"]
trust_level = "trusted"

[projects."/Users/rockcutter/ghq/github.com/voyagegroup/fluct_ms"]
trust_level = "trusted"

[tui]
status_line = ["five-hour-limit", "weekly-limit", "model-with-reasoning", "context-used", "estimated-thread-cost", "used-tokens", "total-input-tokens", "total-output-tokens"]
fullscreen_transcript = false

[tui.model_availability_nux]
"gpt-5.5" = 4

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$HOME/.codex/hooks/stop.sh"'
timeout = 30
statusMessage = "Notifying"

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'bash "$HOME/.codex/hooks/notification.sh"'
timeout = 10
statusMessage = "Notifying"

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = 'bash "$HOME/.codex/hooks/subagent-stop.sh"'
timeout = 10
statusMessage = "Notifying"

[tui.keymap.global]
open_transcript = "ctrl-o"
copy = "alt-o"

[tui.keymap.pager]
close_transcript = "ctrl-o"
