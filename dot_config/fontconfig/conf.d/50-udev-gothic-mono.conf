<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  UDEV Gothic は spacing 属性を持たず fontconfig 上でプロポーショナル扱いになる。
  kitty は等幅フォントしか選ばないため、Noto Sans Mono CJK にフォールバックして文字間隔が広がる。
  スキャン時に spacing=mono を付与して等幅として認識させる。反映には fc-cache -f が必要。
-->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains"><string>UDEV Gothic</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
</fontconfig>
