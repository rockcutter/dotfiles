# ghostty の設定 (~/.config/ghostty/config) にできる限り合わせた kitty 設定
# 設定一覧: https://sw.kovidgoyal.net/kitty/conf/
# 再読み込み: ctrl+shift+f5

# フォント
font_family UDEV Gothic 35NF
font_size 12

# ウィンドウ
hide_window_decorations yes
window_padding_width 0
tab_bar_style hidden
confirm_os_window_close 0
# ghostty はデフォルトで音を鳴らさないので合わせる
enable_audio_bell no

# テーマ
include themes/tinacious-design-dark.conf

# キーバインド
map ctrl+v paste_from_clipboard
